services:
  backend:
    build:
      context: .
      dockerfile: self-hosting/backend/Dockerfile
    restart: unless-stopped
    expose:
      - '8081'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      currency-rates-api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - IS_SELF_HOST=true
      - SYSTEM_DEMO_DISABLED=true
      - APPLICATION_HOST=0.0.0.0
      - APPLICATION_PORT=8081
      - BETTER_AUTH_URL=${APP_URL:-https://dinero.fhestrenos.com}
      - AUTH_ORIGIN=${APP_URL:-https://dinero.fhestrenos.com}
      - APPLICATION_JWT_SECRET=${APPLICATION_JWT_SECRET:-n4mDV54cpLQdjJ3OeR9HqG5wRlTvj7HLwojMZHMCJ1U}
      - APP_SESSION_ID_SECRET=${APP_SESSION_ID_SECRET:-llzUbuVZfb1UT0EWpTem5reL-E4BehcEtzyAdM0bbvo}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-EDuJ8o3_J57VAgB5i0fCvr4ftpeUl3c1I9sQzt50g7M}
      - APPLICATION_DB_HOST=db
      - APPLICATION_DB_PORT=5432
      - APPLICATION_DB_USERNAME=${DB_USER:-budget_tracker}
      - APPLICATION_DB_PASSWORD=${DB_PASSWORD:-secure_db_pass_123}
      - APPLICATION_DB_DATABASE=${DB_NAME:-budget_tracker}
      - APPLICATION_DB_DIALECT=postgres
      - APPLICATION_REDIS_HOST=redis
      - ATTACHMENTS_DIR=/app/packages/backend/data/attachments
    volumes:
      - attachments_data:/app/packages/backend/data/attachments
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8081/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: self-hosting/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:80'
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - IS_SELF_HOST=true
      - SKIP_LANDING=true
      - LISTEN_PORT=80
      - BACKEND_URL=http://backend:8081
      - API_VER=/api/v1

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER:-budget_tracker}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secure_db_pass_123}
      - POSTGRES_DB=${DB_NAME:-budget_tracker}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  currency-rates-api:
    image: letehaha/currency-rates-api:latest
    restart: unless-stopped
    volumes:
      - currency_rates_data:/app/data
    environment:
      - DATABASE_URL=sqlite:/app/data/currency_rates.db?mode=rwc
      - HOST=0.0.0.0
      - PORT=8080
      - DEFAULT_API_BASE=USD
      - SEED_ON_STARTUP=true
      - SYNC_ON_STARTUP=true
      - SYNC_CRON=0 0 8,12,16,20 * * *
      - RUST_LOG=currency_rates=info,tower_http=info
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db_data:
  redis_data:
  currency_rates_data:
  attachments_data:
